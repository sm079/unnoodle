# Text to image without a model: a blank canvas run through the dev node, which takes about three seconds, tints
# the canvas by the seed and writes the prompt on it.
capability = "image.generate"
model = "dev"
model_name = "Dev stand-in"
description = "A tinted canvas with the prompt written on it"
max_count = 4

# The common SDXL-sized buckets at about one and four megapixels
[sizes.1K]
"1:1" = [1024, 1024]
"3:4" = [896, 1152]
"4:3" = [1152, 896]
"9:16" = [768, 1344]
"16:9" = [1344, 768]

[sizes.2K]
"1:1" = [2048, 2048]
"3:4" = [1792, 2304]
"4:3" = [2304, 1792]
"9:16" = [1536, 2688]
"16:9" = [2688, 1536]
