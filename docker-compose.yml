name: unnoodle

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unnoodle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unnoodle}
      POSTGRES_DB: ${POSTGRES_DB:-unnoodle}
    ports:
      # Local machine only; the dev password is not a secret
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18 images keep their data in a versioned folder under /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
