name: image

# Builds the API image (API, worker and migrations) from main and publishes it to GitHub's container registry, where
# the server pulls it from (see deploy/README.md)

on:
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/unnoodle-api:latest
            ghcr.io/${{ github.repository_owner }}/unnoodle-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
