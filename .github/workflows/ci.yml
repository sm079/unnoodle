name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unnoodle/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: unnoodle
          POSTGRES_PASSWORD: unnoodle
          POSTGRES_DB: unnoodle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U unnoodle -d unnoodle_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      UNNOODLE_DATABASE_URL: postgresql+psycopg://unnoodle:unnoodle@127.0.0.1:5432/unnoodle_test
      UNNOODLE_TEST_DATABASE_URL: postgresql+psycopg://unnoodle:unnoodle@127.0.0.1:5432/unnoodle_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.10.4'
          working-directory: apps/api
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - name: Migrations apply to an empty database
        run: uv run alembic upgrade head
      - run: uv run pytest
